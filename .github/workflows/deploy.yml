name: Deploy

# CD workflow: build 镜像 → push ACR → SSH 到 ECS → docker compose pull + up
#
# 触发条件 (v0.10.10 升级, 实现"push → 测试 → 部署"CI/CD 流水线):
#   1. git tag v*.*.* push     → 立即跑 (保留, 生产发版用)
#   2. workflow_dispatch       → 手动跑 (保留)
#   3. Test workflow 跑完      → 只在 success 时跑 (v0.10.10 新增)
#      (push main → Test 跑 → 全绿 → Deploy 跑)
#
# if gate 逻辑:
#   - push tag            → 跑
#   - workflow_dispatch   → 跑
#   - workflow_run        → 只在 conclusion == 'success' 时跑
#      (失败的 Test 不会触发 Deploy, 满足"测试通过才部署")
#
# 镜像 tag:
#   - push tag            → 用 git tag 名 (e.g. v0.10.1, 精确可追溯)
#   - 其他情况             → 用 commit SHA 短 7 位 (e.g. 5604a24)
#   - 不用 :latest(避免"哪个版本在跑"不清楚)
#
# 必备 GitHub Secrets (Settings → Secrets and variables → Actions):
#   ACR_REGISTRY, ACR_USERNAME, ACR_PASSWORD, ECS_HOST, ECS_USER, ECS_SSH_KEY,
#   NEXT_PUBLIC_API_URL, NEXT_PUBLIC_WS_URL

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

# workflow_run 触发的 workflow 默认拿不到 secrets, 需要 permissions + secrets: inherit
# (GitHub 2023 起的默认行为, 但显式声明更稳)
permissions:
  contents: read
  actions: read

# TAG: push tag 时用 tag 名, 其他情况用 commit SHA
# (workflow_run 时 github.ref 是触发 workflow 的 ref = refs/heads/main, 不是 refs/tags/*)
env:
  TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}

jobs:
  # ============== Build + Push ACR ==============
  build:
    name: Build & Push
    # 3 选 1 gate: push tag / workflow_dispatch 必跑, workflow_run 只在 success 跑
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/decision-court/decision-court-backend:${{ env.TAG }}
          # 注入 main.version，让启动日志 / /health 自报版本，而不是恒为 "dev"
          # （production-retrospective-2026-08-05.md §4 P1-2：线上跑的到底是哪版，
          # 只能靠镜像 tag 反推，进程自己说 "dev"）
          build-args: |
            VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 阿里云 ACR（个人版）不认 OCI attestation index：BuildKit 默认
          # provenance=mode=min 会额外产出 attestation manifest + 一个
          # media type 为 application/vnd.oci.empty.v1+json 的空描述符，
          # push 时被 ACR 拒收 —— "denied: unknown manifest class for
          # application/vnd.oci.empty.v1+json"（2026-10-09 首次在新服务器
          # 跑通 Deploy 时暴露）。关掉证明产物，只推普通镜像 manifest。
          provenance: false
          sbom: false

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/decision-court/decision-court-frontend:${{ env.TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_USE_MOCK=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 同 backend：ACR 拒收 attestation index（见上）。
          provenance: false
          sbom: false

  # ============== Deploy to ECS ==============
  deploy:
    name: Deploy to ECS
    needs: build
    # 跟 build job 同样的 gate, 失败时 deploy 跳过
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # R12 根因修复（2026-10-09）：deploy job 此前**既不 checkout 也不上传
      # docker-compose.yml**，只是对服务器上那份**陈旧副本**跑 `compose up`。
      # 后果：改了 compose（例如把 user 从 1001 改成 10001）→ 新镜像确实上线了，
      # 但编排配置没跟着走 → 容器仍按旧配置起来。
      # 2026-10-09 实测踩到：R12 的日志目录权限修复就这样静默失效了一整个部署周期
      # （宿主机 logs/ 已 chown 10001，容器却还是 uid 1001 → 仍写不进去），
      # 最后靠新加的启动期 probe 打 ERROR 才发现。
      # 服务器上的 compose 与 Caddyfile 一直靠**人工 scp**（见
      # docs/deployment/SECOND-LAUNCH-2026-10-09.md §3.1），这条流水线让它自动跟仓库同步。
      - uses: actions/checkout@v4

      - name: 同步编排文件到服务器
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          # 只同步 compose 与 Caddyfile。服务器上的 .env 不在仓库里，不会被碰（§8 红线）。
          # Caddyfile 的"改了要生效"由下面 deploy 脚本按内容哈希决定是否 recreate caddy。
          source: "docker-compose.yml,deploy/caddy/Caddyfile"
          target: "/opt/DecisionCourt/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            # v0.10.12: ECS 实际路径是 /opt/DecisionCourt (大写 D, 跟 scripts/ecs.ps1 一致)
            # 之前写 /opt/decisioncourt (小写 d) 跟 ecs.ps1 不一致,导致 cd fail 整个 deploy 1 秒挂
            cd /opt/DecisionCourt

            # 打印服务器上实际生效的编排关键行, 让"compose 到底更新了没有"在 CI 日志里可见
            # (R12: 这个值如果不等于仓库里的值, 就是同步步骤失效了)
            echo "==> 服务器上 docker-compose.yml 的关键配置"
            grep -n 'user: "' docker-compose.yml || true

            # 拉新镜像
            echo "==> 拉新镜像 (tag: ${{ env.TAG }})"
            REGISTRY="${{ secrets.ACR_REGISTRY }}"
            docker pull "$REGISTRY/decision-court/decision-court-backend:${{ env.TAG }}"
            docker pull "$REGISTRY/decision-court/decision-court-frontend:${{ env.TAG }}"

            # 重打 tag 到 latest(ECS compose 用 :latest)
            docker tag "$REGISTRY/decision-court/decision-court-backend:${{ env.TAG }}" \
                       "$REGISTRY/decision-court/decision-court-backend:latest"
            docker tag "$REGISTRY/decision-court/decision-court-frontend:${{ env.TAG }}" \
                       "$REGISTRY/decision-court/decision-court-frontend:latest"

            # 重启容器
            # v0.10.15: --force-recreate backend frontend 保证新 :latest 强制重建
            # (普通 up -d 在某些 compose 版本下会复用旧容器, image tag 变了但没检测到)
            echo "==> 重启容器 (force-recreate backend/frontend)"
            docker compose up -d --force-recreate backend frontend

            # 显示状态
            echo "==> 部署结果"
            docker compose ps

            # 看 backend 健康
            # v0.10.15: 容器内 wget,不用 host 上 curl
            # 真因: docker-compose.yml L125-126 用 expose 不是 ports (P0-3 安全加固)
            #       host 上 localhost:8080 连不上 backend
            # 修法: 用 docker compose exec 在 backend 容器内 wget
            #       (alpine busybox 自带 wget, Dockerfile 已确认)
            echo "==> Backend health check (容器内 wget)"
            sleep 8
            docker compose exec -T backend wget -qO- http://127.0.0.1:8080/health || (echo "health 失败" && docker compose logs --tail=30 backend && exit 1)

            # Caddyfile：改了必须 recreate caddy 才生效（compose 只重建 backend/frontend）。
            # 但不能每次部署都重建 —— 那会让边缘代理白闪一下。用内容哈希决定：
            # 哈希存 deploy/caddy/.caddyfile.sha256，只有真变了才重建。
            CADDY_FILE=deploy/caddy/Caddyfile
            CADDY_STAMP=deploy/caddy/.caddyfile.sha256
            if [ -f "$CADDY_FILE" ]; then
              NEW_SHA=$(sha256sum "$CADDY_FILE" | awk '{print $1}')
              OLD_SHA=$(cat "$CADDY_STAMP" 2>/dev/null || echo "")
              if [ "$NEW_SHA" != "$OLD_SHA" ]; then
                echo "==> Caddyfile 有变化 (${OLD_SHA:-none} -> $NEW_SHA)，重建 caddy"
                docker compose up -d --force-recreate caddy
                printf '%s\n' "$NEW_SHA" > "$CADDY_STAMP"
                sleep 3
                docker compose ps caddy
              else
                echo "==> Caddyfile 未变化，跳过 caddy"
              fi
            fi

            echo ""
            echo "============================================================"
            echo "  v${{ env.TAG }} 部署完成!"
            echo "============================================================"
